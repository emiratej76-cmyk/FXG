<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPORTY - Home</title>
<style>
body{margin:0; font-family:Arial; background:#0a0f1e; color:white; padding-bottom:90px}
.header{background:#1a2b4d; padding:12px; display:flex; justify-content:space-between; position:sticky; top:0; z-index:10}
.nav{display:flex; gap:8px; background:#132040; padding:10px; overflow-x:auto}
.nav span{padding:6px 14px; background:#1e3a5f; border-radius:20px; font-size:13px; white-space:nowrap}
.card{background:#17233f; margin:10px; border-radius:12px; padding:12px}
.match{padding:12px 0; border-bottom:1px solid #1e3a5f}
.odds{display:flex; gap:6px; margin-top:8px}
.odds button{background:#25385f; border:1px solid #344d7c; color:white; padding:8px; border-radius:8px; flex:1}
.odds button.selected{background:#22c55e; color:black; font-weight:bold; border-color:#22c55e}
.betslip{position:fixed; bottom:0; left:0; right:0; background:#1a2b4d; border-top:2px solid #22c55e; padding:12px; border-radius:16px 16px 0 0; transform:translateY(100%); transition:0.3s}
.betslip.show{transform:translateY(0)}
.betslip button{width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px}
.place{background:#22c55e}
</style>
</head>
<body>
<div class="header"><b style="color:#22c55e">⚽ SPORTY</b><div>💰 <span id="coins">1000</span> FUN</div></div>
<div class="nav"><span>Live</span><span>Uzbek League</span><span style="background:#22c55e;color:black">Premier</span><span>La Liga</span><span>UCL</span></div>
<div style="background:#22c55e; margin:10px; border-radius:12px; padding:12px; text-align:center; font-weight:bold; color:black">FUN POINTS ONLY - NO REAL MONEY</div>

<div class="card">
<div id="matches"></div>
</div>

<div class="betslip" id="slip">
<div style="display:flex; justify-content:space-between"><b>Betslip (<span id="count">0</span>)</b><span onclick="clearSlip()" style="color:#ef4444">Clear</span></div>
<div id="slipList" style="margin:10px 0; font-size:13px"></div>
<div style="display:flex; gap:10px; margin:10px 0"><span>Stake: 100 fun coins</span><span style="margin-left:auto">To win: <b id="toWin" style="color:#22c55e">0</b></span></div>
<button class="place" onclick="placeBet()">PLACE BET - 100 FUN COINS</button>
<div style="font-size:11px; text-align:center; margin-top:8px; color:#94a3b8">This is a game - no real money</div>
</div>

<script>
let coins=parseInt(localStorage.getItem('funCoins')||'1000'); if(coins<=0) coins=1000;
document.getElementById('coins').innerText=coins;
let slip=[];
const games=[
 {home:"Liverpool", away:"Chelsea", time:"Today 19:00", league:"Premier", o1:2.1, oX:3.2, o2:2.8},
 {home:"Man City", away:"Arsenal", time:"Today 21:30", league:"Premier", o1:1.9, oX:3.0, o2:4.1},
 {home:"Pakhtakor", away:"Nasaf", time:"UPL Today", league:"Uzbek", o1:2.5, oX:2.9, o2:2.6},
 {home:"Real Madrid", away:"Barcelona", time:"Tomorrow 20:00", league:"La Liga", o1:2.4, oX:3.4, o2:2.7}
];
function render(){
 let h=""; games.forEach((g,i)=>{
  h+=`<div class="match"><div style="font-size:12px;color:#94a3b8">${g.league} - ${g.time}</div><div style="font-weight:bold;margin:4px 0">${g.home} vs ${g.away}</div><div class="odds">
  <button id="b${i}_1" onclick="addBet(${i},'1',${g.o1},'${g.home}')">${g.home.slice(0,3)}<br>${g.o1}</button>
  <button id="b${i}_X" onclick="addBet(${i},'X',${g.oX},'Draw')">X<br>${g.oX}</button>
  <button id="b${i}_2" onclick="addBet(${i},'2',${g.o2},'${g.away}')">${g.away.slice(0,3)}<br>${g.o2}</button>
  </div></div>`;
 });
 document.getElementById('matches').innerHTML=h;
}
render();

function addBet(gameIdx, type, odd, name){
 let id=gameIdx+"_"+type;
 if(slip.find(s=>s.id===id)){ slip=slip.filter(s=>s.id!==id); document.getElementById('b'+id).classList.remove('selected'); }
 else{
  slip=slip.filter(s=>!s.id.startsWith(gameIdx+"_")); // remove other odds from same game
  document.querySelectorAll(`[id^="b${gameIdx}_"]`).forEach(b=>b.classList.remove('selected'));
  slip.push({id, odd, name, game:games[gameIdx].home+" vs "+games[gameIdx].away, type});
  document.getElementById('b'+id).classList.add('selected');
 }
 updateSlip();
}
function updateSlip(){
 document.getElementById('count').innerText=slip.length;
 if(slip.length===0){ document.getElementById('slip').classList.remove('show'); return; }
 document.getElementById('slip').classList.add('show');
 let list=""; let totalOdd=1; slip.forEach(s=>{ list+=`• ${s.game} - ${s.name} @${s.odd}<br>`; totalOdd*=s.odd; });
 document.getElementById('slipList').innerHTML=list;
 document.getElementById('toWin').innerText=Math.round(totalOdd*100)+" fun coins";
}
function clearSlip(){ slip=[]; document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('selected')); updateSlip(); }
function placeBet(){
 if(coins<100){ alert("No coins! Reset"); return; }
 if(slip.length===0) return;
 coins-=100; let win=Math.random()>0.45; if(win){ let total=1; slip.forEach(s=>total*=s.odd); coins+=Math.round(total*100); alert("✅ WIN! You won "+Math.round(total*100)+" fun coins!"); } else { alert("❌ LOSE! Lost 100 fun coins"); }
 localStorage.setItem('funCoins',coins); document.getElementById('coins').innerText=coins; clearSlip();
}
</script>
</body>
</html>
