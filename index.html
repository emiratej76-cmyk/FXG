<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportyBet GH - AUTO</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{margin:0;font-family:Arial;background:#e9e9e9}
.header{background:#00b578;color:white;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.bal{background:white;color:#00b578;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px}
.match{background:white;margin:6px;border-radius:6px;padding:10px}
.odds{display:flex;gap:6px;margin-top:8px}
.odds button{flex:1;padding:10px;border:1px solid #ddd;background:#f8f8f8;border-radius:4px;font-weight:bold}
.odds button.active{background:#00b578;color:white;border-color:#00b578}
.betSlip{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #00b578;padding:10px;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.depCard{background:white;margin:10px;padding:15px;border-radius:8px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:6px 0;box-sizing:border-box}
.btn{width:100%;padding:14px;background:#00b578;color:white;border:none;border-radius:6px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="header">
<b>SPORTYBET GH</b>
<div class="bal" onclick="showDep()">GH₵<span id="bal">0.00</span> | Deposit</div>
</div>

<div id="matchesPage">
<div style="background:#1a1a1a;color:white;padding:8px;display:flex;gap:10px;font-size:13px"><span style="color:#00b578;border-bottom:2px solid #00b578;padding-bottom:4px">Football</span><span>Live</span><span>Virtual</span></div>
<div id="matchList"></div>
<div style="height:120px"></div>
</div>

<div id="depPage" style="display:none">
<div class="depCard">
<h3 style="margin:0;color:#00b578">Auto Deposit - Straight to Balance</h3>
<p style="font-size:12px">Powered by Paystack - Instant Credit</p>
<input id="depAmount" type="number" placeholder="Amount GH₵ e.g. 10">
<input id="userEmail" type="email" placeholder="Email">
<button class="btn" onclick="pay()">DEPOSIT NOW - AUTO CREDIT</button>
<p id="payStatus" style="font-size:13px;margin-top:10px"></p>
<button style="margin-top:10px;width:100%;padding:10px;background:#eee;border:none;border-radius:6px" onclick="showMatches()">Back to Matches</button>
</div>
</div>

<div class="betSlip" id="betSlip" style="display:none">
<div style="display:flex;justify-content:space-between;font-size:13px"><span id="slipCount">0 Selections</span><span onclick="clearSlip()" style="color:red">Clear</span></div>
<div id="slipOdds" style="margin:6px 0;font-weight:bold">Total Odds: 1.00</div>
<input id="stake" type="number" placeholder="Stake GH₵" oninput="calcWin()" style="padding:8px">
<div style="font-size:12px;margin:4px 0">Possible Win: GH₵<span id="win">0.00</span></div>
<button class="btn" style="background:#ff7a00" onclick="placeBet()">Place Bet</button>
</div>

<script>
let balance=parseFloat(localStorage.getItem('sportyBal')||'0');
document.getElementById('bal').innerText=balance.toFixed(2);
let selections=[];
let matches=[
{name:"Man City vs Arsenal", h:"2.10", d:"3.30", a:"3.20"},
{name:"Barcelona vs Real Madrid", h:"2.50", d:"3.40", a:"2.60"},
{name:"Hearts vs Kotoko", h:"1.85", d:"3.10", a:"4.20"},
{name:"Liverpool vs Chelsea", h:"1.95", d:"3.50", a:"3.80"},
{name:"Bayern vs Dortmund", h:"1.70", d:"3.90", a:"4.50"}
];
let list=document.getElementById('matchList');
matches.forEach((m,i)=>{
 list.innerHTML+=`<div class="match"><div style="font-size:13px;font-weight:bold">${m.name}</div><div style="font-size:11px;color:gray">Today 19:00</div><div class="odds"><button onclick="addBet(${i},'1',${m.h})">1<br>${m.h}</button><button onclick="addBet(${i},'X',${m.d})">X<br>${m.d}</button><button onclick="addBet(${i},'2',${m.a})">2<br>${m.a}</button></div></div>`;
});
function showDep(){document.getElementById('matchesPage').style.display='none';document.getElementById('depPage').style.display='block';}
function showMatches(){document.getElementById('depPage').style.display='none';document.getElementById('matchesPage').style.display='block';}
function addBet(i, type, odd){
 selections.push({match:matches[i].name,type,odd});
 updateSlip();
}
function updateSlip(){
 if(selections.length==0){document.getElementById('betSlip').style.display='none';return;}
 document.getElementById('betSlip').style.display='block';
 document.getElementById('slipCount').innerText=selections.length+" Selections";
 let total=1; selections.forEach(s=>total*=s.odd);
 document.getElementById('slipOdds').innerText="Total Odds: "+total.toFixed(2);
 calcWin();
}
function calcWin(){
 let stake=parseFloat(document.getElementById('stake').value||0);
 let total=1; selections.forEach(s=>total*=s.odd);
 document.getElementById('win').innerText=(stake*total).toFixed(2);
}
function clearSlip(){selections=[];updateSlip();}
function placeBet(){
 let stake=parseFloat(document.getElementById('stake').value||0);
 if(stake<1){alert("Min stake 1");return;}
 if(stake>balance){alert("Low balance, deposit!");showDep();return;}
 balance-=stake; localStorage.setItem('sportyBal',balance); document.getElementById('bal').innerText=balance.toFixed(2);
 alert("Bet Placed! Possible win: GH₵"+document.getElementById('win').innerText);
 clearSlip();
 // Simulate win 50%
 setTimeout(()=>{ if(Math.random()>0.5){ let win=parseFloat(document.getElementById('win').innerText); balance+=win; localStorage.setItem('sportyBal',balance); document.getElementById('bal').innerText=balance.toFixed(2); alert("YOU WON GH₵"+win.toFixed(2)+"!!!"); }},2000);
}
function pay(){
 let amount=document.getElementById('depAmount').value;
 let email=document.getElementById('userEmail').value;
 if(!amount||amount<1){alert("Min 1");return;}
 if(!email){alert("Email needed");return;}
 let handler=PaystackPop.setup({
  key: 'REPLACE_WITH_YOUR_FULL_PK_TEST_KEY_HERE',
  email: email,
  amount: amount*100,
  currency: 'GHS',
  ref: 'SPORTY_'+Date.now(),
  callback:function(res){
   document.getElementById('payStatus').innerText="Success "+res.reference+" - Crediting...";
   setTimeout(()=>{
    balance+=parseFloat(amount);
    localStorage.setItem('sportyBal',balance);
    document.getElementById('bal').innerText=balance.toFixed(2);
    document.getElementById('payStatus').innerText="✅ GH₵"+amount+" CREDITED! Balance: "+balance.toFixed(2);
    setTimeout(showMatches,1000);
   },800);
  },
  onClose:function(){document.getElementById('payStatus').innerText="Payment closed";}
 });
 handler.openIframe();
}
</script>
</body>
</html>
