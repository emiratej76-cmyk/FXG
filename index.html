<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportyBet</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2;padding-bottom:60px}
.header{background:#00a859;display:flex;justify-content:space-between;align-items:center;padding:12px;color:white;position:sticky;top:0;z-index:10}
.bal{background:white;color:#00a859;padding:7px 14px;border-radius:20px;font-weight:900;font-size:13px;border:none}
.tabs{background:#2c2c2c;color:#999;display:flex;gap:15px;padding:10px;font-size:14px}
.tabs.on{color:#00e676;border-bottom:2px solid #00e676}
.league{background:#e5e5e5;padding:6px 10px;font-size:12px;font-weight:bold;color:#444}
.card{background:white;padding:10px;border-bottom:1px solid #eee}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.odds div{border:1px solid #ccc;border-radius:4px;text-align:center;padding:9px 0;background:#fafafa;font-size:13px}
.odds div.sel{background:#00a859;color:white;border-color:#00a859}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;text-align:center;z-index:99}
.bottom div{flex:1;padding:10px 0;font-size:11px}
.slip{position:fixed;bottom:50px;left:0;right:0;background:white;border-top:3px solid #00a859;padding:12px;display:none;z-index:100}
</style>
</head>
<body>
<div class="header"><b><i>SportyBet</i></b><button class="bal" onclick="openDep()">GH₵ <span id="bal">0.00</span> | Deposit</button></div>
<div class="tabs"><span class="on">Football</span><span>Live</span><span>Jackpot</span><span>Virtuals</span><span>Table Tennis</span></div>
<div id="games"></div>

<div id="dep" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#f2f2f2;z-index:200">
<div style="background:#00a859;color:white;padding:14px;display:flex;justify-content:space-between"><b>Deposit</b><b onclick="closeDep()">X</b></div>
<div style="background:white;margin:12px;padding:16px;border-radius:8px">
<input id="amt" type="number" placeholder="Amount e.g 10" style="width:100%;padding:14px;border:1px solid #ccc;border-radius:6px;margin:5px 0">
<input id="email" type="email" placeholder="Email" style="width:100%;padding:14px;border:1px solid #ccc;border-radius:6px;margin:5px 0">
<button onclick="pay()" style="width:100%;padding:15px;background:#00a859;color:white;border:none;border-radius:6px;font-weight:bold">PAY NOW - AUTO CREDIT</button>
<p id="stat" style="text-align:center;font-size:13px"></p>
</div>
</div>

<div class="slip" id="slip">
<div style="display:flex;justify-content:space-between"><b id="cnt">0 Bets</b><span onclick="clearS()" style="color:red">Clear</span></div>
<div id="det" style="font-size:11px;color:#555;margin:5px 0"></div>
<input id="stake" type="number" placeholder="Stake" oninput="calc()" style="width:60%;padding:10px;border:1px solid #ccc;border-radius:6px"> <span>Odds <b id="todd">1.00</b></span>
<div style="margin:8px 0">Win: GH₵<b id="twin">0.00</b></div>
<button onclick="bet()" style="width:100%;background:#ff8c00;color:white;border:none;padding:14px;border-radius:6px;font-weight:bold">Place Bet</button>
</div>

<div class="bottom"><div style="color:#00a859">Sports</div><div>Live</div><div>Jackpot</div><div>Me</div></div>

<script>
var bal=parseFloat(localStorage.getItem('sBal')||'0');
document.getElementById('bal').innerText=bal.toFixed(2);
var games=[
{lg:"England - Premier League", time:"19:30", a:"Man City", b:"Arsenal", o:[2.10,3.30,3.20]},
{lg:"England - Premier League", time:"19:30", a:"Barcelona", b:"Real Madrid", o:[2.50,3.40,2.60]},
{lg:"Ghana - Premier League", time:"18:00", a:"Hearts of Oak", b:"Kotoko", o:[1.85,3.10,4.20]},
{lg:"England - Premier League", time:"21:15", a:"Liverpool", b:"Chelsea", o:[1.95,3.50,3.80]},
{lg:"Germany - Bundesliga", time:"19:45", a:"Bayern", b:"Dortmund", o:[1.70,3.90,4.50]}
];
var sel=[];
function draw(){
 var h=""; var last="";
 for(var i=0;i<games.length;i++){
  var g=games[i];
  if(g.lg!=last){h+='<div class="league">'+g.lg+' - 1X2</div>'; last=g.lg;}
  h+='<div class="card"><div style="font-size:11px;color:#888">'+g.time+'</div><div style="font-weight:bold;font-size:13px">'+g.a+' vs '+g.b+'</div><div class="odds"><div id="c'+i+'0" onclick="pick('+i+',0)">1<br><b>'+g.o[0]+'</b></div><div id="c'+i+'1" onclick="pick('+i+',1)">X<br><b>'+g.o[1]+'</b></div><div id="c'+i+'2" onclick="pick('+i+',2)">2<br><b>'+g.o[2]+'</b></div></div></div>';
 }
 document.getElementById('games').innerHTML=h;
}
function pick(i,o){
 var id='c'+i+o;
 var el=document.getElementById(id);
 var key=i+'-'+o;
 var idx=-1; for(var k=0;k<sel.length;k++){if(sel[k].key==key) idx=k;}
 if(idx>-1){sel.splice(idx,1); el.classList.remove('sel');}
 else{
  for(var k=0;k<sel.length;k++){if(sel[k].key.startsWith(i+'-')){var old=document.getElementById('c'+sel[k].key.replace('-','')); if(old) old.classList.remove('sel'); sel.splice(k,1); k--;}}
  sel.push({key:key, txt:games[i].a+' vs '+games[i].b+' - '+['1','X','2'][o], odd:games[i].o[o]});
  el.classList.add('sel');
 }
 update();
}
function update(){
 if(sel.length==0){document.getElementById('slip').style.display='none';return;}
 document.getElementById('slip').style.display='block';
 document.getElementById('cnt').innerText=sel.length+' Bets';
 var tot=1; var d='';
 for(var i=0;i<sel.length;i++){tot*=sel[i].odd; d+=sel[i].txt+' @'+sel[i].odd+'<br>';}
 document.getElementById('det').innerHTML=d;
 document.getElementById('todd').innerText=tot.toFixed(2);
 calc();
}
function calc(){var s=parseFloat(document.getElementById('stake').value||0); var t=parseFloat(document.getElementById('todd').innerText||1); document.getElementById('twin').innerText=(s*t).toFixed(2);}
function clearS(){sel=[]; draw(); update();}
function bet(){
 var stake=parseFloat(document.getElementById('stake').value||0);
 if(stake<1){alert('Min 1');return;}
 if(stake>bal){alert('Low balance, deposit'); openDep();return;}
 bal-=stake; localStorage.setItem('sBal',bal); document.getElementById('bal').innerText=bal.toFixed(2);
 var win=parseFloat(document.getElementById('twin').innerText);
 alert('Bet placed! Win GH₵'+win);
 clearS();
}
function openDep(){document.getElementById('dep').style.display='block';}
function closeDep(){document.getElementById('dep').style.display='none';}
function pay(){
 var amount=document.getElementById('amt').value;
 var email=document.getElementById('email').value;
 if(!amount||amount<1){alert('Min 1');return;}
 if(!email){alert('Email');return;}
 PaystackPop.setup({
  key: pk_test_ff0fc4af1d78d716172d600c82f57a135ba653bc'', // REPLACE WITH YOUR FULL KEY FROM DASHBOARD - TAP COPY ICON
  email: email,
  amount: amount*100,
  currency: 'GHS',
  ref: 'SB_'+Date.now(),
  callback:function(r){
   document.getElementById('stat').innerText='Success! Crediting...';
   bal+=parseFloat(amount); localStorage.setItem('sBal',bal); document.getElementById('bal').innerText=bal.toFixed(2);
   document.getElementById('stat').innerText='GH₵'+amount+' CREDITED!';
   setTimeout(closeDep,1200);
  },
  onClose:function(){document.getElementById('stat').innerText='Closed';}
 }).openIframe();
}
draw();
</script>
</body>
</html>
